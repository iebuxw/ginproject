# 内存
maxmemory 64mb
maxmemory-policy allkeys-lru

# 连接
timeout 300
maxclients 1000
tcp-keepalive 60

# 持久化 (RDB)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
dbfilename dump.rdb
dir /data

# 慢日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 网络
bind 0.0.0.0
port 6379

# 日志
loglevel notice
