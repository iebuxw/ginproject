basePath: /api
definitions:
  controller.LoginRequest:
    properties:
      password:
        example: "123456"
        type: string
      username:
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  model.CronTask:
    properties:
      body:
        type: string
      created_at:
        type: string
      cron:
        type: string
      headers:
        type: string
      id:
        type: integer
      last_exec_status:
        description: 最近一次执行状态，-1=无记录（只读，列表子查询填充）
        type: integer
      method:
        type: string
      name:
        type: string
      remark:
        type: string
      status:
        type: integer
      timeout:
        type: integer
      updated_at:
        type: string
      url:
        type: string
    type: object
  model.CronTaskExecution:
    properties:
      created_at:
        type: string
      duration_ms:
        type: integer
      error_msg:
        type: string
      http_status:
        type: integer
      id:
        type: integer
      response:
        type: string
      status:
        type: integer
      task_id:
        type: integer
      trigger:
        type: string
    type: object
  model.DictData:
    properties:
      created_at:
        type: string
      dict_type_id:
        type: integer
      id:
        type: integer
      label:
        type: string
      remark:
        type: string
      sort:
        type: integer
      status:
        type: integer
      updated_at:
        type: string
      value:
        type: string
    type: object
  model.DictType:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  model.LoginLog:
    properties:
      created_at:
        type: string
      id:
        type: integer
      ip:
        type: string
      message:
        type: string
      status:
        type: integer
      username:
        type: string
    type: object
  model.Menu:
    properties:
      children:
        items:
          $ref: '#/definitions/model.Menu'
        type: array
      created_at:
        type: string
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
      path:
        type: string
      permission:
        type: string
      sort:
        type: integer
      status:
        type: integer
      type:
        type: integer
      updated_at:
        type: string
    type: object
  model.Role:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      menus:
        items:
          $ref: '#/definitions/model.Menu'
        type: array
      name:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  model.User:
    properties:
      created_at:
        type: string
      description:
        type: string
      email:
        type: string
      id:
        type: integer
      last_login_at:
        type: string
      phone:
        type: string
      roles:
        items:
          $ref: '#/definitions/model.Role'
        type: array
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  utils.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
host: localhost:8000
info:
  contact: {}
  description: 后台管理系统 API 文档
  title: GinAdmin API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: 修改当前用户的登录密码
      parameters:
      - description: 密码参数
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 修改密码
      tags:
      - 认证
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码登录，返回 JWT Token
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误
          schema:
            $ref: '#/definitions/utils.Response'
      summary: 用户登录
      tags:
      - 认证
  /auth/logout:
    post:
      description: 将当前 Token 加入 Redis 黑名单
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - 认证
  /auth/userinfo:
    get:
      description: 返回当前用户的 ID、用户名、菜单树和权限列表
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  properties:
                    id:
                      type: integer
                    menus:
                      type: array
                    permissions:
                      items:
                        type: string
                      type: array
                    username:
                      type: string
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: 获取当前用户信息
      tags:
      - 认证
  /cron-tasks:
    get:
      description: 分页查询定时任务列表，支持关键词搜索（名称/URL）
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 搜索关键词（名称/URL）
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  properties:
                    list:
                      items:
                        $ref: '#/definitions/model.CronTask'
                      type: array
                    total:
                      type: integer
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: 获取定时任务分页列表
      tags:
      - 定时任务
    post:
      consumes:
      - application/json
      parameters:
      - description: 任务信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CronTask'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 新建定时任务
      tags:
      - 定时任务
  /cron-tasks/{id}:
    delete:
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 删除定时任务
      tags:
      - 定时任务
    get:
      description: 根据 ID 查询定时任务详情
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 任务不存在
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 获取定时任务详情
      tags:
      - 定时任务
    put:
      consumes:
      - application/json
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 任务信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.CronTask'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 编辑定时任务
      tags:
      - 定时任务
  /cron-tasks/{id}/executions:
    get:
      description: 分页查询指定任务的执行日志
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  properties:
                    list:
                      items:
                        $ref: '#/definitions/model.CronTaskExecution'
                      type: array
                    total:
                      type: integer
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: 获取任务执行日志
      tags:
      - 定时任务
  /cron-tasks/{id}/run:
    post:
      description: 手动触发任务立即执行，写入 manual 执行日志
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 立即执行一次
      tags:
      - 定时任务
  /cron-tasks/{id}/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 状态（1=启用 0=停用）
        in: body
        name: body
        required: true
        schema:
          properties:
            status:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 启停定时任务
      tags:
      - 定时任务
  /dict-data:
    get:
      description: 根据字典类型 ID 分页查询数据项
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 字典类型 ID
        in: query
        name: dict_type_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  properties:
                    list:
                      items:
                        $ref: '#/definitions/model.DictData'
                      type: array
                    total:
                      type: integer
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: 获取字典数据分页列表
      tags:
      - 数据字典
    post:
      consumes:
      - application/json
      parameters:
      - description: 字典数据信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.DictData'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 新建字典数据
      tags:
      - 数据字典
  /dict-data/{id}:
    delete:
      parameters:
      - description: 字典数据 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 删除字典数据
      tags:
      - 数据字典
    get:
      parameters:
      - description: 字典数据 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 字典数据不存在
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 获取字典数据详情
      tags:
      - 数据字典
    put:
      consumes:
      - application/json
      parameters:
      - description: 字典数据 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 字典数据信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.DictData'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 编辑字典数据
      tags:
      - 数据字典
  /dict-data/by-code/{code}:
    get:
      parameters:
      - description: 字典编码（如 gender、user_status）
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.DictData'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: 根据字典编码获取数据项
      tags:
      - 数据字典
  /dict-types:
    get:
      description: 分页查询字典类型列表，支持关键词搜索
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 搜索关键词（名称/编码）
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  properties:
                    list:
                      items:
                        $ref: '#/definitions/model.DictType'
                      type: array
                    total:
                      type: integer
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: 获取字典类型分页列表
      tags:
      - 数据字典
    post:
      consumes:
      - application/json
      parameters:
      - description: 字典类型信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.DictType'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 新建字典类型
      tags:
      - 数据字典
  /dict-types/{id}:
    delete:
      description: 根据 ID 删除字典类型，存在关联数据项时拒绝删除
      parameters:
      - description: 字典类型 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 存在关联数据项，无法删除
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 删除字典类型
      tags:
      - 数据字典
    get:
      description: 根据 ID 查询字典类型详情
      parameters:
      - description: 字典类型 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 字典类型不存在
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 获取字典类型详情
      tags:
      - 数据字典
    put:
      consumes:
      - application/json
      parameters:
      - description: 字典类型 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 字典类型信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.DictType'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 编辑字典类型
      tags:
      - 数据字典
  /login-logs:
    get:
      description: 分页查询登录日志记录
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 用户名筛选
        in: query
        name: username
        type: string
      - default: 0
        description: 状态筛选 1=成功 0=失败
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  properties:
                    list:
                      items:
                        $ref: '#/definitions/model.LoginLog'
                      type: array
                    total:
                      type: integer
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: 查询登录日志
      tags:
      - 登录日志
  /logs:
    get:
      description: 分页查询操作日志，优先走 ES 全文检索，失败回退 MySQL
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 搜索关键词
        in: query
        name: keyword
        type: string
      - description: 模块筛选
        in: query
        name: module
        type: string
      - description: 请求方法筛选
        in: query
        name: method
        type: string
      - description: 开始时间 (RFC3339)
        in: query
        name: start_time
        type: string
      - description: 结束时间 (RFC3339)
        in: query
        name: end_time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  properties:
                    data_source:
                      type: string
                    list:
                      type: array
                    total:
                      type: integer
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: 查询操作日志
      tags:
      - 操作日志
  /logs/cleanup:
    post:
      description: 按保留天数分批删除旧日志（操作日志/登录日志），ES 同步清理。供定时任务调用，需携带 secret
      parameters:
      - description: 清理密钥（与 LOG_CLEANUP_SECRET 比对，优先于 query secret）
        in: header
        name: X-Cleanup-Secret
        type: string
      - description: 清理密钥（与 LOG_CLEANUP_SECRET 比对，header 缺失时回退）
        in: query
        name: secret
        type: string
      - default: 30
        description: 保留天数（删除创建时间早于 now-days 的日志）
        in: query
        name: days
        type: integer
      - description: 清理范围：operation/login/all，默认 all
        in: query
        name: scope
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 参数非法
          schema:
            $ref: '#/definitions/utils.Response'
      summary: 清理旧日志
      tags:
      - 操作日志
  /logs/download/{taskID}:
    get:
      description: 下载已完成的导出文件，下载后服务端自动删除
      parameters:
      - description: 任务 ID
        in: path
        name: taskID
        required: true
        type: string
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: 无权下载或文件不存在
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 下载导出文件
      tags:
      - 操作日志
  /logs/export:
    post:
      consumes:
      - application/json
      description: 异步导出操作日志为 Excel 文件，通过 WebSocket 通知完成
      parameters:
      - description: 导出参数
        in: body
        name: body
        schema:
          type: object
      - description: 请求方法筛选
        in: body
        name: body.body.method
        schema:
          type: string
      - description: 搜索关键词（路径/参数）
        in: body
        name: body.body.keyword
        schema:
          type: string
      - description: 开始时间 (yyyy-MM-dd HH:mm:ss)
        in: body
        name: body.body.start_time
        schema:
          type: string
      - description: 结束时间 (yyyy-MM-dd HH:mm:ss)
        in: body
        name: body.body.end_time
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回任务 ID
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  properties:
                    task_id:
                      type: string
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: 发起日志导出任务
      tags:
      - 操作日志
  /logs/export-status:
    get:
      description: 根据任务 ID 查询导出进度
      parameters:
      - description: 任务 ID
        in: query
        name: task_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 任务不存在
          schema:
